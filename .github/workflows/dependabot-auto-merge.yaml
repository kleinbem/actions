name: Dependabot auto-merge

# Reusable workflow: arms auto-merge on Dependabot PRs whose every update is a
# patch or minor bump. Anything else (majors, unclassified) stays open for a
# human. Consumers call it on pull_request:
#
#   on: pull_request
#   permissions: {}
#   jobs:
#     auto-merge:
#       permissions:
#         pull-requests: read
#       uses: kleinbem/actions/.github/workflows/dependabot-auto-merge.yaml@<sha> # vX
#       secrets:
#         app-id: ${{ secrets.APP_ID }}
#         app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
#
# The app token makes the app the merger: a merge done with GITHUB_TOKEN would
# not trigger main's push workflows. APP_ID/APP_PRIVATE_KEY are Dependabot
# secrets per repo (nix/infra/github-secrets.tf).

on:
  workflow_call:
    secrets:
      # Not required: other PRs call this too and have no Dependabot secrets.
      app-id:
        required: false
      app-private-key:
        required: false

permissions: {}

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # fetch-metadata verifies the PR's commits
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      # Allowlist, not "not major": a group is only as safe as its riskiest entry.
      # fetch-metadata only checks the first commit; a pushed-on fix must not ride along.
      - id: policy
        env:
          DEPS: ${{ steps.meta.outputs.updated-dependencies-json }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          ok=$(jq -r 'length > 0 and all(.[]; .updateType == "version-update:semver-patch" or .updateType == "version-update:semver-minor")' <<<"$DEPS")
          authors=$(gh api --paginate "repos/$REPO/pulls/$PR/commits" --jq '.[] | .author.login // "unknown"' | sort -u)
          if [ "$authors" != "dependabot[bot]" ]; then
            echo "::notice::Not auto-merging: commits by $(echo "$authors" | paste -sd, -)"
            ok=false
          fi
          echo "auto-merge=${ok:-false}" >> "$GITHUB_OUTPUT"
      # Minted on both outcomes: a failing re-run must also revoke an earlier arm.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write
          permission-pull-requests: write
      - if: steps.policy.outputs.auto-merge == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
      - if: steps.policy.outputs.auto-merge != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ "$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')" = true ]; then
            gh pr merge --disable-auto "$PR_URL"
          fi
