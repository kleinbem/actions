name: Dependabot auto-merge

# Reusable workflow: arms auto-merge on Dependabot's patch and minor updates,
# so they merge once the required checks pass. Majors stay open for a human.
# Consumers call it on pull_request:
#
#   on: pull_request
#   permissions: {}
#   jobs:
#     auto-merge:
#       uses: kleinbem/actions/.github/workflows/dependabot-auto-merge.yaml@<sha> # vX
#       secrets:
#         app-id: ${{ secrets.APP_ID }}
#         app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
#
# The app token makes the app the merger: a merge done with GITHUB_TOKEN would
# not trigger main's push workflows. APP_ID/APP_PRIVATE_KEY are Dependabot
# secrets per repo (nix/infra/github-secrets.tf).

on:
  workflow_call:
    secrets:
      # Not required: other PRs call this too and have no Dependabot secrets.
      app-id:
        required: false
      app-private-key:
        required: false

permissions: {}

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write
          permission-pull-requests: write
      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
