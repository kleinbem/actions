name: 'actionlint (kleinbem)'
description: 'Lints GitHub Actions workflow files with actionlint and shellcheck.'

inputs:
  args:
    description: 'Flags and options to pass to actionlint.'
    required: false
    default: '-color'
  files:
    description: 'Workflow files to check (empty checks all workflows under .github/workflows).'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Run actionlint
      shell: bash
      env:
        ACTIONLINT_ARGS: ${{ inputs.args }}
        ACTIONLINT_FILES: ${{ inputs.files }}
      run: |
        set -euo pipefail

        if ! command -v shellcheck >/dev/null 2>&1; then
          echo "shellcheck is required for actionlint but was not found on PATH" >&2
          exit 1
        fi

        if ! command -v python3 >/dev/null 2>&1; then
          echo "python3 is required for parsing actionlint arguments but was not found on PATH" >&2
          exit 1
        fi

        ACTIONLINT_VERSION="1.7.12"

        case "$(uname -s)/$(uname -m)" in
          Linux/x86_64)
            platform="linux_amd64"
            checksum="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
            ;;
          Linux/aarch64 | Linux/arm64)
            platform="linux_arm64"
            checksum="325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6"
            ;;
          Darwin/arm64)
            platform="darwin_arm64"
            checksum="aba9ced2dee8d27fecca3dc7feb1a7f9a52caefa1eb46f3271ea66b6e0e6953f"
            ;;
          Darwin/x86_64)
            platform="darwin_amd64"
            checksum="5b44c3bc2255115c9b69e30efc0fecdf498fdb63c5d58e17084fd5f16324c644"
            ;;
          *)
            echo "Unsupported platform: $(uname -s)/$(uname -m)" >&2
            exit 1
            ;;
        esac

        target_dir="${RUNNER_TEMP:-/tmp}/actionlint-${ACTIONLINT_VERSION}"
        binary="$target_dir/actionlint"
        if [ ! -x "$binary" ]; then
          mkdir -p "$target_dir"
          archive_name="actionlint_${ACTIONLINT_VERSION}_${platform}.tar.gz"
          archive="${RUNNER_TEMP:-/tmp}/$archive_name"

          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive_name}" -o "$archive"
          if command -v sha256sum >/dev/null 2>&1; then
            echo "${checksum}  ${archive}" | sha256sum -c -
          else
            echo "${checksum}  ${archive}" | shasum -a 256 -c -
          fi
          tar -xzf "$archive" -C "$target_dir" actionlint
          rm -f "$archive"
        fi

        parsed_args=()
        if [ -n "$ACTIONLINT_ARGS" ]; then
          tmp_args="${RUNNER_TEMP:-/tmp}/actionlint-args.$$"
          python3 -c 'import sys, shlex; sys.stdout.write("".join(f"{x}\0" for x in shlex.split(sys.argv[1])))' "$ACTIONLINT_ARGS" > "$tmp_args"
          while IFS= read -r -d '' item; do
            parsed_args+=("$item")
          done < "$tmp_args"
          rm -f "$tmp_args"
        fi

        shopt -s nullglob
        if [ -n "$ACTIONLINT_FILES" ]; then
          tmp_files="${RUNNER_TEMP:-/tmp}/actionlint-files.$$"
          python3 -c 'import sys, shlex; sys.stdout.write("".join(f"{x}\0" for x in shlex.split(sys.argv[1])))' "$ACTIONLINT_FILES" > "$tmp_files"
          parsed_files=()
          while IFS= read -r -d '' item; do
            parsed_files+=("$item")
          done < "$tmp_files"
          rm -f "$tmp_files"
          "$binary" -shellcheck=shellcheck ${parsed_args[@]+"${parsed_args[@]}"} ${parsed_files[@]+"${parsed_files[@]}"}
        else
          files=(.github/workflows/*.yml .github/workflows/*.yaml)
          if [ ${#files[@]} -gt 0 ]; then
            "$binary" -shellcheck=shellcheck ${parsed_args[@]+"${parsed_args[@]}"} "${files[@]}"
          else
            "$binary" -shellcheck=shellcheck ${parsed_args[@]+"${parsed_args[@]}"}
          fi
        fi
